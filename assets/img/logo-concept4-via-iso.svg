<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="viaIsoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Symbol: Isometric planes connected through vertical via pipe -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="12" fill="url(#viaIsoGrad)"/>
    <!-- Top Layer isometric diamond -->
    <path d="M24 11 L36 17 L24 23 L12 17 Z" fill="rgba(255,255,255,0.4)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Bottom Layer isometric diamond -->
    <path d="M24 25 L36 31 L24 37 L12 31 Z" fill="rgba(255,255,255,0.2)" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Vertical connecting via channel -->
    <line x1="24" y1="17" x2="24" y2="31" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="17" r="3" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="24" cy="31" r="3" fill="#064e3b" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <text x="64" y="36" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#0f172a" letter-spacing="-0.03em">VIA</text>
  <rect x="122" y="19" width="54" height="18" rx="9" fill="#ecfdf5"/>
  <text x="149" y="32" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#059669" text-anchor="middle" letter-spacing="0.06em">3D LAYERS</text>
  <text x="65" y="47" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#64748b">Traversée des couches R&amp;D</text>
</svg>
