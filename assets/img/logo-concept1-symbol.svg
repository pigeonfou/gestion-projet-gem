<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="viaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="48" height="48" rx="12" fill="url(#viaGrad)"/>
  
  <!-- PCB via trace in V shape -->
  <!-- Left pad -->
  <circle cx="14" cy="14" r="4.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="14" cy="14" r="2" fill="#4f46e5"/>

  <!-- Right pad -->
  <circle cx="34" cy="14" r="4.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="34" cy="14" r="2" fill="#4f46e5"/>

  <!-- Copper trace path at 45 deg angles meeting at the bottom via -->
  <path d="M14 18 L24 32 L34 18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central through-hole Via pad -->
  <circle cx="24" cy="32" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="24" cy="32" r="2.5" fill="#0f172a"/>
</svg>
