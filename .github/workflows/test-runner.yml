name: Test serveur gestion-projet

on:
  workflow_dispatch:

jobs:
  test-server:
    runs-on: self-hosted

    steps:
      - name: Informations serveur
        run: |
          echo "=== Runner gestion-projet ==="
          echo "Utilisateur : $(whoami)"
          echo "Machine : $(hostname)"
          echo "Répertoire : $(pwd)"
          echo
          echo "=== PHP ==="
          php --version
          echo
          echo "=== Git ==="
          git --version
          echo
          echo "=== Apache ==="
          apache2ctl -v

      - name: Vérification autorisation déploiement
        run: |
          echo "=== Droits sudo du runner ==="
          sudo -n -l

      - name: Fin du test
        run: |
          echo "=== Test terminé avec succès ==="
